spark.master                      yarn
spark.submit.deployMode           client
# Spark kutuphaneleri her iste yeniden yuklenmesin diye HDFS'te tek arsiv
spark.yarn.archive                hdfs:///spark/spark-jars.zip
# Varsayilan: her executor 2 cekirdek + 1 GB; 7 executor = tum kume (Gigabyte 4, Mini 2, Vento 1)
spark.executor.cores              2
spark.executor.memory             1g
spark.executor.instances          7
spark.driver.memory               1g
spark.yarn.am.memory              512m
# Biten islerin kaydi -> History Server (http://192.168.1.10:18080)
spark.eventLog.enabled            true
spark.eventLog.dir                hdfs:///spark-logs
spark.history.fs.logDirectory     hdfs:///spark-logs
spark.yarn.historyServer.address  192.168.1.10:18080
