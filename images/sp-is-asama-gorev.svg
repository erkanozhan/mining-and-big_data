<!-- Şekil: Spark'ta iş (job), aşama (stage), görev (task) ve karıştırma (shuffle) — 1BRC sorgusu | Ders notu: Spark ve YARN ile Dağıtık Veri Madenciliği -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f9fafb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.15"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <text x="600" y="38" font-size="24" font-weight="bold" text-anchor="middle" fill="#111827">İş, Aşama, Görev: Spark Bir Sorguyu Nasıl Böler?</text>
  <rect x="210" y="56" width="780" height="34" rx="8" fill="#1f2937"/>
  <text x="600" y="79" font-size="14" text-anchor="middle" fill="#e5e7eb" font-family="Consolas, 'DejaVu Sans Mono', monospace">df.groupBy("istasyon").agg(min, avg, max).orderBy("istasyon").collect()</text>
  <text x="600" y="114" font-size="14" text-anchor="middle" fill="#4b5563">Bir eylem (collect) bir iş (job) başlatır. İş, veriyi ağ üzerinden karıştırma (shuffle) gereken yerlerden aşamalara bölünür.</text>

  <!-- HDFS -->
  <text x="80" y="156" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">HDFS</text>
  <g font-size="11" text-anchor="middle" fill="#374151">
    <rect x="40" y="170" width="80" height="34" rx="4" fill="#e5e7eb" stroke="#9ca3af"/><text x="80" y="192">part-00000</text>
    <rect x="40" y="226" width="80" height="34" rx="4" fill="#e5e7eb" stroke="#9ca3af"/><text x="80" y="248">part-00001</text>
    <rect x="40" y="282" width="80" height="34" rx="4" fill="#e5e7eb" stroke="#9ca3af"/><text x="80" y="304">part-00002</text>
    <text x="80" y="346" font-size="18">⋮</text>
    <rect x="40" y="370" width="80" height="34" rx="4" fill="#e5e7eb" stroke="#9ca3af"/><text x="80" y="392">part-00039</text>
  </g>

  <!-- Aşama 0 -->
  <rect x="150" y="140" width="330" height="290" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="315" y="164" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Aşama 0 · 20 görev (her bölüm için 1)</text>
  <g font-size="12" fill="#1e3a8a">
    <rect x="170" y="176" width="290" height="34" rx="6" fill="#dbeafe"/><text x="182" y="198">Görev 0: oku → kısmi topla (81 satır)</text>
    <rect x="170" y="232" width="290" height="34" rx="6" fill="#dbeafe"/><text x="182" y="254">Görev 1: oku → kısmi topla (81 satır)</text>
    <rect x="170" y="288" width="290" height="34" rx="6" fill="#dbeafe"/><text x="182" y="310">Görev 2: oku → kısmi topla (81 satır)</text>
    <text x="315" y="346" font-size="18" text-anchor="middle">⋮</text>
    <rect x="170" y="376" width="290" height="34" rx="6" fill="#dbeafe"/><text x="182" y="398">Görev 19: oku → kısmi topla (81 satır)</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)">
    <line x1="120" y1="187" x2="166" y2="193"/><line x1="120" y1="243" x2="166" y2="249"/>
    <line x1="120" y1="299" x2="166" y2="305"/><line x1="120" y1="387" x2="166" y2="393"/>
  </g>

  <!-- Shuffle -->
  <rect x="500" y="140" width="190" height="290" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-dasharray="6 4"/>
  <text x="595" y="164" font-size="15" font-weight="bold" text-anchor="middle" fill="#c2410c">Shuffle (karıştırma)</text>
  <g stroke="#f97316" stroke-width="1.6" fill="none" opacity="0.85">
    <path d="M 460 193 C 560 193, 620 220, 714 230"/><path d="M 460 193 C 560 200, 620 290, 714 300"/><path d="M 460 193 C 560 210, 620 360, 714 375"/>
    <path d="M 460 249 C 560 249, 620 230, 714 232"/><path d="M 460 249 C 560 260, 620 300, 714 302"/><path d="M 460 249 C 560 270, 620 365, 714 377"/>
    <path d="M 460 305 C 560 300, 620 240, 714 234"/><path d="M 460 305 C 560 305, 620 304, 714 304"/><path d="M 460 305 C 560 320, 620 370, 714 379"/>
    <path d="M 460 393 C 560 380, 620 250, 714 236"/><path d="M 460 393 C 560 380, 620 315, 714 306"/><path d="M 460 393 C 560 393, 620 385, 714 381"/>
  </g>
  <text x="595" y="456" font-size="12.5" text-anchor="middle" fill="#9a3412">aynı istasyonun kısmi sonuçları</text>
  <text x="595" y="474" font-size="12.5" text-anchor="middle" fill="#9a3412">aynı göreve gönderilir</text>

  <!-- Aşama 1 -->
  <rect x="710" y="140" width="250" height="290" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="835" y="164" font-size="15" font-weight="bold" text-anchor="middle" fill="#6d28d9">Aşama 1 · nihai toplama</text>
  <g font-size="12" fill="#4c1d95">
    <rect x="726" y="214" width="218" height="40" rx="6" fill="#ede9fe"/><text x="738" y="239">Adana … Erzurum</text>
    <rect x="726" y="284" width="218" height="40" rx="6" fill="#ede9fe"/><text x="738" y="309">Eskişehir … Mardin</text>
    <rect x="726" y="359" width="218" height="40" rx="6" fill="#ede9fe"/><text x="738" y="384">Mersin … Zonguldak</text>
  </g>

  <!-- Aşama 2 + driver -->
  <rect x="980" y="140" width="190" height="130" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1075" y="166" font-size="15" font-weight="bold" text-anchor="middle" fill="#047857">Aşama 2 · sırala</text>
  <text x="1075" y="196" font-size="12.5" text-anchor="middle" fill="#065f46">orderBy de bir shuffle</text>
  <text x="1075" y="216" font-size="12.5" text-anchor="middle" fill="#065f46">gerektirir (aralığa göre</text>
  <text x="1075" y="236" font-size="12.5" text-anchor="middle" fill="#065f46">bölme)</text>
  <rect x="980" y="310" width="190" height="80" rx="12" fill="#10b981"/>
  <text x="1075" y="342" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Driver</text>
  <text x="1075" y="366" font-size="12.5" text-anchor="middle" fill="#ecfdf5">81 satırlık sonuç</text>
  <g stroke="#6b7280" stroke-width="2" marker-end="url(#a)">
    <line x1="960" y1="234" x2="976" y2="215"/><line x1="1075" y1="270" x2="1075" y2="306"/>
  </g>

  <!-- Açıklama şeridi -->
  <rect x="40" y="500" width="1120" height="118" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <g font-size="13.5" fill="#374151">
    <text x="62" y="530"><tspan font-weight="bold" fill="#1d4ed8">Dar bağımlılık:</tspan> Her görev yalnızca kendi bölümünü işler (okuma, filtre, map, kısmi toplama). Görevler birbirini beklemez.</text>
    <text x="62" y="556"><tspan font-weight="bold" fill="#c2410c">Geniş bağımlılık (shuffle):</tspan> Bir görevin girdisi birçok önceki görevden gelir. Veri ağdan taşınır; aşama sınırı buradadır.</text>
    <text x="62" y="582"><tspan font-weight="bold" fill="#047857">Kısmi toplama sayesinde</tspan> ağa 100 milyon satır değil, görev başına en çok 81 satır (20 × 81 = 1.620 satır) çıkar.</text>
    <text x="62" y="606" fill="#6b7280">Görev sayısı = bölüm sayısı. Aynı anda çalışabilen görev sayısı = toplam executor çekirdeği (bizim kümede 14).</text>
  </g>
</svg>
