<!-- Şekil: Laboratuvar Hadoop + Spark kümesi (3 düğüm) | Ders notu: Spark ve YARN ile Dağıtık Veri Madenciliği -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f9fafb"/>
    </linearGradient>
    <linearGradient id="blueHead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="greenHead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="orangeHead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.15"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Executor yuvası: 2 çekirdek + 1 GB -->
    <g id="slot">
      <rect x="0" y="0" width="62" height="40" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="31" y="17" font-size="11" font-weight="bold" text-anchor="middle" fill="#5b21b6">executor</text>
      <text x="31" y="32" font-size="10" text-anchor="middle" fill="#6d28d9">2 çek · 1 GB</text>
    </g>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <text x="600" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#111827">Laboratuvar Kümemiz: Üç Farklı Makine, Tek Bir Sistem</text>
  <text x="600" y="66" font-size="14" text-anchor="middle" fill="#4b5563">Hadoop 3.5 (HDFS + YARN) ve Spark 4.1 · Java 17 · Linux Mint 22 · her makine hem veri saklar hem hesap yapar</text>

  <!-- ===== Kart 1: Gigabyte ===== -->
  <rect x="30" y="90" width="360" height="470" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M 30 104 a 14 14 0 0 1 14 -14 h 332 a 14 14 0 0 1 14 14 v 46 h -360 z" fill="url(#blueHead)"/>
  <text x="210" y="117" font-size="19" font-weight="bold" text-anchor="middle" fill="#ffffff">FX-Gigabyte</text>
  <text x="210" y="139" font-size="13" text-anchor="middle" fill="#eff6ff">192.168.1.10 · yönetici (master) + işçi</text>
  <text x="210" y="174" font-size="13" text-anchor="middle" fill="#374151">i7-4790K · 4 çekirdek / 8 iş parçacığı · 16 GB</text>

  <text x="50" y="206" font-size="13" font-weight="bold" fill="#1d4ed8">Yönetim servisleri</text>
  <g font-size="12" text-anchor="middle">
    <rect x="50" y="214" width="150" height="28" rx="6" fill="#dbeafe"/><text x="125" y="233" fill="#1e3a8a">NameNode</text>
    <rect x="210" y="214" width="160" height="28" rx="6" fill="#dbeafe"/><text x="290" y="233" fill="#1e3a8a">ResourceManager</text>
    <rect x="50" y="248" width="150" height="28" rx="6" fill="#dbeafe"/><text x="125" y="267" fill="#1e3a8a">SecondaryNameNode</text>
    <rect x="210" y="248" width="160" height="28" rx="6" fill="#dbeafe"/><text x="290" y="267" fill="#1e3a8a">Geçmiş sunucuları</text>
  </g>
  <text x="50" y="304" font-size="13" font-weight="bold" fill="#374151">İşçi servisleri</text>
  <g font-size="12" text-anchor="middle">
    <rect x="50" y="312" width="150" height="28" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="125" y="331" fill="#111827">DataNode</text>
    <rect x="210" y="312" width="160" height="28" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="290" y="331" fill="#111827">NodeManager</text>
  </g>
  <text x="50" y="370" font-size="13" font-weight="bold" fill="#374151">YARN'a verilen: 8 GB · 9 sanal çekirdek</text>
  <use href="#slot" transform="translate(50, 380)"/><use href="#slot" transform="translate(130, 380)"/>
  <use href="#slot" transform="translate(210, 380)"/><use href="#slot" transform="translate(290, 380)"/>
  <text x="50" y="452" font-size="13" font-weight="bold" fill="#374151">HDFS diski</text>
  <text x="50" y="474" font-size="13" fill="#374151">Toshiba 1 TB HDD (~916 GB)</text>
  <text x="50" y="510" font-size="12" fill="#6b7280">Web: NameNode :9870 · YARN :8088</text>
  <text x="50" y="530" font-size="12" fill="#6b7280">Spark geçmişi :18080 · MR geçmişi :19888</text>

  <!-- ===== Kart 2: Mini ===== -->
  <rect x="420" y="90" width="360" height="470" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M 420 104 a 14 14 0 0 1 14 -14 h 332 a 14 14 0 0 1 14 14 v 46 h -360 z" fill="url(#greenHead)"/>
  <text x="600" y="117" font-size="19" font-weight="bold" text-anchor="middle" fill="#ffffff">FX-Mini</text>
  <text x="600" y="139" font-size="13" text-anchor="middle" fill="#ecfdf5">192.168.1.11 · işçi + sınıftaki istemci</text>
  <text x="600" y="174" font-size="13" text-anchor="middle" fill="#374151">i5-6500T · 4 çekirdek · 8 GB</text>

  <text x="440" y="206" font-size="13" font-weight="bold" fill="#047857">İstemci (derste projeksiyonda)</text>
  <rect x="440" y="214" width="320" height="62" rx="6" fill="#d1fae5"/>
  <text x="600" y="239" font-size="13" font-weight="bold" text-anchor="middle" fill="#065f46">Spark driver</text>
  <text x="600" y="260" font-size="12" text-anchor="middle" fill="#065f46">spark-submit · pyspark · Spark arayüzü :4040</text>
  <text x="440" y="304" font-size="13" font-weight="bold" fill="#374151">İşçi servisleri</text>
  <g font-size="12" text-anchor="middle">
    <rect x="440" y="312" width="150" height="28" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="515" y="331" fill="#111827">DataNode</text>
    <rect x="600" y="312" width="160" height="28" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="680" y="331" fill="#111827">NodeManager</text>
  </g>
  <text x="440" y="370" font-size="13" font-weight="bold" fill="#374151">YARN'a verilen: 4 GB · 5 sanal çekirdek</text>
  <use href="#slot" transform="translate(440, 380)"/><use href="#slot" transform="translate(520, 380)"/>
  <text x="440" y="452" font-size="13" font-weight="bold" fill="#374151">HDFS diski</text>
  <text x="440" y="474" font-size="13" fill="#374151">Sistem diski (~109 GB)</text>
  <text x="440" y="510" font-size="12" fill="#6b7280">Bellek payı küçük tutuldu: derste</text>
  <text x="440" y="530" font-size="12" fill="#6b7280">masaüstü ve tarayıcı da çalışıyor.</text>

  <!-- ===== Kart 3: Vento ===== -->
  <rect x="810" y="90" width="360" height="470" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M 810 104 a 14 14 0 0 1 14 -14 h 332 a 14 14 0 0 1 14 14 v 46 h -360 z" fill="url(#orangeHead)"/>
  <text x="990" y="117" font-size="19" font-weight="bold" text-anchor="middle" fill="#ffffff">FX-Vento</text>
  <text x="990" y="139" font-size="13" text-anchor="middle" fill="#fffbeb">192.168.1.12 · işçi</text>
  <text x="990" y="174" font-size="13" text-anchor="middle" fill="#374151">Core 2 Duo E8400 (2008) · 2 çekirdek · 6 GB</text>

  <text x="830" y="206" font-size="13" font-weight="bold" fill="#b45309">Yavaş düğüm (straggler) adayı</text>
  <rect x="830" y="214" width="320" height="62" rx="6" fill="#fef3c7"/>
  <text x="990" y="239" font-size="12" text-anchor="middle" fill="#78350f">Aynı görevi diğerlerinden yavaş bitirir.</text>
  <text x="990" y="260" font-size="12" text-anchor="middle" fill="#78350f">Heterojen kümenin canlı örneği.</text>
  <text x="830" y="304" font-size="13" font-weight="bold" fill="#374151">İşçi servisleri</text>
  <g font-size="12" text-anchor="middle">
    <rect x="830" y="312" width="150" height="28" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="905" y="331" fill="#111827">DataNode</text>
    <rect x="990" y="312" width="160" height="28" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="1070" y="331" fill="#111827">NodeManager</text>
  </g>
  <text x="830" y="370" font-size="13" font-weight="bold" fill="#374151">YARN'a verilen: 3 GB · 3 sanal çekirdek</text>
  <use href="#slot" transform="translate(830, 380)"/>
  <text x="830" y="452" font-size="13" font-weight="bold" fill="#374151">HDFS diski</text>
  <text x="830" y="474" font-size="13" fill="#374151">Sistem diski (~218 GB)</text>
  <text x="830" y="510" font-size="12" fill="#6b7280">İşlemci SSE4.2 desteklemiyor: NumPy</text>
  <text x="830" y="530" font-size="12" fill="#6b7280">2.3+ gibi yeni sürümler çalışmaz.</text>

  <!-- ===== Ağ ===== -->
  <line x1="210" y1="560" x2="210" y2="600" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="600" y1="560" x2="600" y2="600" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="990" y1="560" x2="990" y2="600" stroke="#6b7280" stroke-width="2.5"/>
  <rect x="150" y="600" width="900" height="40" rx="8" fill="#374151"/>
  <text x="600" y="626" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Yerel ağ (örnek adresler) · güvenlik duvarı yalnızca lab makinelerine açık</text>
  <text x="600" y="672" font-size="13" text-anchor="middle" fill="#4b5563">Toplam: 15 GB bellek · 17 sanal çekirdek · 7 executor yuvası · 1,2 TB HDFS (her blok 2 kopya)</text>
</svg>
