<!-- Şekil: MapReduce ve Spark'ta ara sonuçların yeri (disk ↔ bellek) | Ders notu: Spark ve YARN ile Dağıtık Veri Madenciliği -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f9fafb"/>
    </linearGradient>
    <linearGradient id="grayHead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="orangeHead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.15"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <!-- Disk (silindir), 70 x 74 -->
    <g id="disk">
      <path d="M 0 12 v 50 a 35 12 0 0 0 70 0 v -50" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
      <ellipse cx="35" cy="12" rx="35" ry="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
      <path d="M 0 30 a 35 12 0 0 0 70 0" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    </g>
    <!-- Bellek modülü (RAM), 90 x 44 -->
    <g id="ram">
      <rect x="0" y="0" width="90" height="34" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
      <rect x="8" y="8" width="16" height="18" rx="2" fill="#10b981"/>
      <rect x="29" y="8" width="16" height="18" rx="2" fill="#10b981"/>
      <rect x="50" y="8" width="16" height="18" rx="2" fill="#10b981"/>
      <rect x="71" y="8" width="12" height="18" rx="2" fill="#10b981"/>
      <g stroke="#10b981" stroke-width="2">
        <line x1="10" y1="34" x2="10" y2="42"/><line x1="22" y1="34" x2="22" y2="42"/>
        <line x1="34" y1="34" x2="34" y2="42"/><line x1="46" y1="34" x2="46" y2="42"/>
        <line x1="58" y1="34" x2="58" y2="42"/><line x1="70" y1="34" x2="70" y2="42"/>
        <line x1="82" y1="34" x2="82" y2="42"/>
      </g>
    </g>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <text x="600" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#111827">Ara Sonuçlar Nerede Durur? MapReduce ve Spark</text>
  <text x="600" y="66" font-size="14" text-anchor="middle" fill="#4b5563">Üç adımlık yinelemeli bir iş (örneğin k-Means'in üç iterasyonu)</text>

  <!-- ===================== ÜST: MapReduce ===================== -->
  <rect x="20" y="86" width="1160" height="230" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M 20 100 a 14 14 0 0 1 14 -14 h 1132 a 14 14 0 0 1 14 14 v 26 h -1160 z" fill="url(#grayHead)"/>
  <text x="600" y="113" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">Hadoop MapReduce: her iş, sonucunu HDFS'e (diske) yazar; bir sonraki iş oradan yeniden okur</text>

  <g font-size="13" text-anchor="middle" fill="#374151">
    <use href="#disk" transform="translate(50, 180)"/>  <text x="85" y="280">HDFS</text>
    <use href="#disk" transform="translate(330, 180)"/> <text x="365" y="280">HDFS</text>
    <use href="#disk" transform="translate(610, 180)"/> <text x="645" y="280">HDFS</text>
    <use href="#disk" transform="translate(890, 180)"/> <text x="925" y="280">HDFS</text>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <rect x="160" y="190" width="130" height="56" rx="10" fill="#6b7280"/> <text x="225" y="223">MR işi 1</text>
    <rect x="440" y="190" width="130" height="56" rx="10" fill="#6b7280"/> <text x="505" y="223">MR işi 2</text>
    <rect x="720" y="190" width="130" height="56" rx="10" fill="#6b7280"/> <text x="785" y="223">MR işi 3</text>
  </g>
  <g stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="124" y1="218" x2="156" y2="218"/> <line x1="292" y1="218" x2="326" y2="218"/>
    <line x1="404" y1="218" x2="436" y2="218"/> <line x1="572" y1="218" x2="606" y2="218"/>
    <line x1="684" y1="218" x2="716" y2="218"/> <line x1="852" y1="218" x2="886" y2="218"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="600">
    <text x="310" y="170">yaz</text> <text x="420" y="170">oku</text>
    <text x="590" y="170">yaz</text> <text x="700" y="170">oku</text>
  </g>
  <rect x="990" y="160" width="170" height="110" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="1075" y="190" font-size="14" font-weight="bold" text-anchor="middle" fill="#b91c1c">Bedel</text>
  <text x="1075" y="214" font-size="13" text-anchor="middle" fill="#7f1d1d">işler arası: diske yaz,</text>
  <text x="1075" y="234" font-size="13" text-anchor="middle" fill="#7f1d1d">yeniden oku (2–3 kopya)</text>
  <text x="1075" y="254" font-size="13" text-anchor="middle" fill="#7f1d1d">her işte yeni JVM'ler</text>

  <!-- ===================== ALT: Spark ===================== -->
  <rect x="20" y="340" width="1160" height="230" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M 20 354 a 14 14 0 0 1 14 -14 h 1132 a 14 14 0 0 1 14 14 v 26 h -1160 z" fill="url(#orangeHead)"/>
  <text x="600" y="367" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">Apache Spark: tek bir uygulama; ara sonuçlar executor belleklerinde kalır, disk yalnızca başta ve sonda</text>

  <g font-size="13" text-anchor="middle" fill="#374151">
    <use href="#disk" transform="translate(50, 434)"/>  <text x="85" y="534">HDFS</text>
    <use href="#disk" transform="translate(890, 434)"/> <text x="925" y="534">HDFS</text>
    <use href="#ram" transform="translate(320, 450)"/>  <text x="365" y="516">bellek</text>
    <use href="#ram" transform="translate(600, 450)"/>  <text x="645" y="516">bellek</text>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <rect x="160" y="444" width="130" height="56" rx="10" fill="#f59e0b"/> <text x="225" y="477">Adım 1</text>
    <rect x="440" y="444" width="130" height="56" rx="10" fill="#f59e0b"/> <text x="505" y="477">Adım 2</text>
    <rect x="720" y="444" width="130" height="56" rx="10" fill="#f59e0b"/> <text x="785" y="477">Adım 3</text>
  </g>
  <g stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="124" y1="472" x2="156" y2="472"/> <line x1="292" y1="472" x2="316" y2="472"/>
    <line x1="412" y1="472" x2="436" y2="472"/> <line x1="572" y1="472" x2="596" y2="472"/>
    <line x1="692" y1="472" x2="716" y2="472"/> <line x1="852" y1="472" x2="886" y2="472"/>
  </g>
  <rect x="990" y="414" width="170" height="110" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="1075" y="444" font-size="14" font-weight="bold" text-anchor="middle" fill="#047857">Kazanç</text>
  <text x="1075" y="468" font-size="13" text-anchor="middle" fill="#065f46">1 okuma + 1 yazma</text>
  <text x="1075" y="488" font-size="13" text-anchor="middle" fill="#065f46">executor'lar iş boyunca</text>
  <text x="1075" y="508" font-size="13" text-anchor="middle" fill="#065f46">ayakta kalır</text>
</svg>
