<!-- Şekil: Holdout ve 5-katlı çapraz doğrulama (k-fold cross validation) | Ders notu: Veri Madenciliği ve Büyük Veri -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f9fafb"/>
    </linearGradient>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="testGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.13"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Başlık -->
  <text x="550" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#111827">Model Değerlendirme: Holdout ve k-Katlı Çapraz Doğrulama</text>
  <text x="550" y="66" font-size="14" text-anchor="middle" fill="#4b5563">Veri, modeli eğitmek ve hiç görmediği örneklerle sınamak için bölünür</text>

  <!-- ===== Holdout şeridi ===== -->
  <rect x="24" y="88" width="1052" height="72" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="44" y="120" font-size="16" font-weight="bold" fill="#1f2937">Holdout</text>
  <text x="44" y="140" font-size="13" fill="#4b5563">(tek seferlik ayırma)</text>
  <rect x="260" y="104" width="459" height="40" rx="6" fill="url(#trainGrad)" filter="url(#shadow)"/>
  <rect x="723" y="104" width="193" height="40" rx="6" fill="url(#testGrad)" filter="url(#shadow)"/>
  <text x="489.5" y="130" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">%70 Eğitim</text>
  <text x="819.5" y="130" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">%30 Test</text>
  <text x="934" y="120" font-size="13" fill="#4b5563">Sonuç, tek bir</text>
  <text x="934" y="138" font-size="13" fill="#4b5563">ayırmaya bağlıdır</text>

  <!-- ===== 5-katlı çapraz doğrulama ===== -->
  <text x="550" y="206" font-size="19" font-weight="bold" text-anchor="middle" fill="#1f2937">5-Katlı Çapraz Doğrulama (5-Fold Cross Validation)</text>

  <!-- Tüm veri: 5 eşit kat -->
  <text x="44" y="248" font-size="16" font-weight="bold" fill="#1f2937">Tüm veri</text>
  <text x="44" y="266" font-size="13" fill="#4b5563">5 eşit kata bölünür</text>
  <g font-size="15" font-weight="600" text-anchor="middle" fill="#374151">
    <rect x="260" y="230" width="128" height="40" rx="6" fill="url(#dataGrad)" stroke="#6b7280" stroke-width="1.2"/>
    <text x="324" y="256">Kat 1</text>
    <rect x="392" y="230" width="128" height="40" rx="6" fill="url(#dataGrad)" stroke="#6b7280" stroke-width="1.2"/>
    <text x="456" y="256">Kat 2</text>
    <rect x="524" y="230" width="128" height="40" rx="6" fill="url(#dataGrad)" stroke="#6b7280" stroke-width="1.2"/>
    <text x="588" y="256">Kat 3</text>
    <rect x="656" y="230" width="128" height="40" rx="6" fill="url(#dataGrad)" stroke="#6b7280" stroke-width="1.2"/>
    <text x="720" y="256">Kat 4</text>
    <rect x="788" y="230" width="128" height="40" rx="6" fill="url(#dataGrad)" stroke="#6b7280" stroke-width="1.2"/>
    <text x="852" y="256">Kat 5</text>
  </g>
  <line x1="260" y1="284" x2="916" y2="284" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Turlar -->
  <g font-size="16" font-weight="bold" fill="#1f2937">
    <text x="44" y="326">Tur 1</text>
    <text x="44" y="378">Tur 2</text>
    <text x="44" y="430">Tur 3</text>
    <text x="44" y="482">Tur 4</text>
    <text x="44" y="534">Tur 5</text>
  </g>

  <g font-size="15" font-weight="600" text-anchor="middle" fill="#ffffff">
    <!-- Tur 1: Kat 1 test -->
    <rect x="260" y="300" width="128" height="40" rx="6" fill="url(#testGrad)" filter="url(#shadow)"/>
    <text x="324" y="326">Test</text>
    <rect x="392" y="300" width="128" height="40" rx="6" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="456" y="326">Eğitim</text>
    <rect x="524" y="300" width="128" height="40" rx="6" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="588" y="326">Eğitim</text>
    <rect x="656" y="300" width="128" height="40" rx="6" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="720" y="326">Eğitim</text>
    <rect x="788" y="300" width="128" height="40" rx="6" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="852" y="326">Eğitim</text>

    <!-- Tur 2: Kat 2 test -->
    <rect x="260" y="352" width="128" height="40" rx="6" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="324" y="378">Eğitim</text>
    <rect x="392" y="352" width="128" height="40" rx="6" fill="url(#testGrad)" filter="url(#shadow)"/>
    <text x="456" y="378">Test</text>
    <rect x="524" y="352" width="128" height="40" rx="6" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="588" y="378">Eğitim</text>
    <rect x="656" y="352" width="128" height="40" rx="6" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="720" y="378">Eğitim</text>
    <rect x="788" y="352" width="128" height="40" rx="6" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="852" y="378">Eğitim</text>

    <!-- Tur 3: Kat 3 test -->
    <rect x="260" y="404" width="128" height="40" rx="6" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="324" y="430">Eğitim</text>
    <rect x="392" y="404" width="128" height="40" rx="6" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="456" y="430">Eğitim</text>
    <rect x="524" y="404" width="128" height="40" rx="6" fill="url(#testGrad)" filter="url(#shadow)"/>
    <text x="588" y="430">Test</text>
    <rect x="656" y="404" width="128" height="40" rx="6" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="720" y="430">Eğitim</text>
    <rect x="788" y="404" width="128" height="40" rx="6" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="852" y="430">Eğitim</text>

    <!-- Tur 4: Kat 4 test -->
    <rect x="260" y="456" width="128" height="40" rx="6" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="324" y="482">Eğitim</text>
    <rect x="392" y="456" width="128" height="40" rx="6" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="456" y="482">Eğitim</text>
    <rect x="524" y="456" width="128" height="40" rx="6" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="588" y="482">Eğitim</text>
    <rect x="656" y="456" width="128" height="40" rx="6" fill="url(#testGrad)" filter="url(#shadow)"/>
    <text x="720" y="482">Test</text>
    <rect x="788" y="456" width="128" height="40" rx="6" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="852" y="482">Eğitim</text>

    <!-- Tur 5: Kat 5 test -->
    <rect x="260" y="508" width="128" height="40" rx="6" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="324" y="534">Eğitim</text>
    <rect x="392" y="508" width="128" height="40" rx="6" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="456" y="534">Eğitim</text>
    <rect x="524" y="508" width="128" height="40" rx="6" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="588" y="534">Eğitim</text>
    <rect x="656" y="508" width="128" height="40" rx="6" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="720" y="534">Eğitim</text>
    <rect x="788" y="508" width="128" height="40" rx="6" fill="url(#testGrad)" filter="url(#shadow)"/>
    <text x="852" y="534">Test</text>
  </g>

  <!-- Başarım çıktıları -->
  <g font-size="16" fill="#1f2937">
    <text x="934" y="326">→ Başarım <tspan font-weight="bold" fill="#7c3aed">E₁</tspan></text>
    <text x="934" y="378">→ Başarım <tspan font-weight="bold" fill="#7c3aed">E₂</tspan></text>
    <text x="934" y="430">→ Başarım <tspan font-weight="bold" fill="#7c3aed">E₃</tspan></text>
    <text x="934" y="482">→ Başarım <tspan font-weight="bold" fill="#7c3aed">E₄</tspan></text>
    <text x="934" y="534">→ Başarım <tspan font-weight="bold" fill="#7c3aed">E₅</tspan></text>
  </g>

  <!-- Gösterge -->
  <g font-size="14" fill="#4b5563">
    <rect x="330" y="566" width="28" height="18" rx="4" fill="url(#trainGrad)"/>
    <text x="366" y="580">Eğitim kümesi (4 kat)</text>
    <rect x="580" y="566" width="28" height="18" rx="4" fill="url(#testGrad)"/>
    <text x="616" y="580">Test kümesi (1 kat)</text>
  </g>

  <!-- Formül kutusu -->
  <rect x="200" y="602" width="700" height="86" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="638" font-size="20" font-weight="bold" text-anchor="middle" fill="#4c1d95">Genel Başarım = (E₁ + E₂ + E₃ + E₄ + E₅) / 5</text>
  <text x="550" y="670" font-size="15" text-anchor="middle" fill="#5b21b6">Her örnek tam olarak bir kez test kümesinde yer alır.</text>
</svg>
