<!-- Şekil: Toplu işleme (batch) ve akış işleme (stream) karşılaştırması | Ders notu: Veri Madenciliği ve Büyük Veri -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f9fafb"/>
    </linearGradient>
    <linearGradient id="cylGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="jobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="procGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="outGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.13"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Başlık -->
  <text x="600" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#111827">Toplu İşleme (Batch) ve Akış İşleme (Stream)</text>
  <text x="600" y="66" font-size="14" text-anchor="middle" fill="#4b5563">Veriyi biriktirip sonra işlemek mi, yoksa geldiği anda işlemek mi?</text>

  <!-- ===================== BATCH ===================== -->
  <rect x="20" y="84" width="1160" height="246" rx="14" fill="#fffdf6" stroke="#fde68a" stroke-width="1.5"/>
  <text x="44" y="116" font-size="18" font-weight="bold" fill="#b45309">Toplu İşleme (Batch)</text>
  <text x="236" y="116" font-size="14" fill="#4b5563">— veri önce biriktirilir, sonra büyük parçalar hâlinde topluca işlenir</text>

  <!-- Oklar -->
  <g stroke="#6b7280" stroke-width="2.5" fill="none">
    <line x1="204" y1="222" x2="254" y2="222" marker-end="url(#arrow)"/>
    <line x1="442" y1="222" x2="494" y2="222" marker-end="url(#arrow)"/>
    <line x1="722" y1="222" x2="774" y2="222" marker-end="url(#arrow)"/>
  </g>

  <!-- 1. Veri kaynakları -->
  <rect x="44" y="182" width="160" height="80" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="124" y="216" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">Veri kaynakları</text>
  <text x="124" y="238" font-size="13" text-anchor="middle" fill="#4b5563">(VT, log, dosya…)</text>

  <!-- 2. Depolama silindiri -->
  <g filter="url(#shadow)">
    <path d="M 260 172 L 260 272 A 90 14 0 0 0 440 272 L 440 172 Z" fill="url(#cylGrad)"/>
    <ellipse cx="350" cy="172" rx="90" ry="14" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
  </g>
  <!-- biriken veri katmanları -->
  <path d="M 262 236 A 88 10 0 0 0 438 236" fill="none" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M 262 254 A 88 10 0 0 0 438 254" fill="none" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="350" y="208" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Depolama</text>
  <text x="350" y="228" font-size="13" text-anchor="middle" fill="#ffffff">(HDFS / Veri Gölü)</text>
  <text x="350" y="306" font-size="13" text-anchor="middle" fill="#1d4ed8" font-weight="600">veri birikir</text>

  <!-- 3. Periyodik iş -->
  <rect x="500" y="170" width="222" height="104" rx="10" fill="url(#jobGrad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Saat simgesi (02:00) -->
  <circle cx="537" cy="222" r="22" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
  <line x1="537" y1="222" x2="537" y2="206" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
  <line x1="537" y1="222" x2="546" y2="217" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="537" cy="222" r="2.5" fill="#92400e"/>
  <text x="570" y="200" font-size="15" font-weight="bold" fill="#1f2937">Periyodik iş</text>
  <text x="570" y="220" font-size="13" fill="#4b5563">(MapReduce, Spark)</text>
  <rect x="568" y="232" width="134" height="26" rx="13" fill="#f59e0b"/>
  <text x="635" y="250" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">her gece 02:00</text>

  <!-- 4. Raporlar / Modeller -->
  <rect x="780" y="182" width="160" height="80" rx="10" fill="url(#outGrad)" filter="url(#shadow)"/>
  <text x="860" y="217" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Raporlar /</text>
  <text x="860" y="238" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Modeller</text>

  <!-- Gecikme -->
  <line x1="962" y1="150" x2="962" y2="300" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="984" y="190" width="180" height="64" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1074" y="215" font-size="14" font-weight="600" text-anchor="middle" fill="#92400e">Gecikme:</text>
  <text x="1074" y="238" font-size="15" font-weight="bold" text-anchor="middle" fill="#92400e">dakikalar – saatler</text>

  <!-- ===================== STREAM ===================== -->
  <rect x="20" y="346" width="1160" height="246" rx="14" fill="#f6fdff" stroke="#a5f3fc" stroke-width="1.5"/>
  <text x="44" y="378" font-size="18" font-weight="bold" fill="#0e7490">Akış İşleme (Stream)</text>
  <text x="236" y="378" font-size="14" fill="#4b5563">— her olay, sisteme ulaştığı anda sürekli olarak işlenir</text>

  <!-- Oklar ve akan olaylar -->
  <g stroke="#0891b2" stroke-width="2.5" fill="none">
    <line x1="224" y1="484" x2="286" y2="484" marker-end="url(#arrowCyan)"/>
    <line x1="490" y1="484" x2="546" y2="484" marker-end="url(#arrowCyan)"/>
    <line x1="760" y1="484" x2="796" y2="484" marker-end="url(#arrowCyan)"/>
  </g>
  <g fill="#06b6d4" stroke="#ffffff" stroke-width="1.5">
    <circle cx="238" cy="484" r="5"/><circle cx="254" cy="484" r="5"/><circle cx="270" cy="484" r="5"/>
    <circle cx="502" cy="484" r="5"/><circle cx="518" cy="484" r="5"/><circle cx="534" cy="484" r="5"/>
    <circle cx="772" cy="484" r="5"/>
  </g>

  <!-- 1. Olay akışı -->
  <rect x="44" y="432" width="180" height="104" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="134" y="458" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">Olay akışı</text>
  <text x="134" y="478" font-size="13" text-anchor="middle" fill="#4b5563">(sensörler, tıklamalar,</text>
  <text x="134" y="496" font-size="13" text-anchor="middle" fill="#4b5563">işlemler)</text>
  <g fill="#06b6d4">
    <circle cx="74" cy="518" r="4"/><circle cx="92" cy="518" r="4" opacity="0.8"/><circle cx="110" cy="518" r="4"/>
    <circle cx="128" cy="518" r="4" opacity="0.7"/><circle cx="146" cy="518" r="4"/><circle cx="164" cy="518" r="4" opacity="0.8"/>
    <circle cx="182" cy="518" r="4"/><circle cx="200" cy="518" r="4" opacity="0.7"/>
  </g>

  <!-- 2. Mesaj kuyruğu (Kafka) -->
  <rect x="292" y="438" width="198" height="92" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="391" y="462" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">Mesaj kuyruğu (Kafka)</text>
  <rect x="304" y="474" width="174" height="40" rx="6" fill="#ecfeff" stroke="#a5f3fc"/>
  <g fill="#06b6d4">
    <rect x="310" y="480" width="14" height="28" rx="3" opacity="0.45"/>
    <rect x="330" y="480" width="14" height="28" rx="3" opacity="0.55"/>
    <rect x="350" y="480" width="14" height="28" rx="3" opacity="0.65"/>
    <rect x="370" y="480" width="14" height="28" rx="3" opacity="0.75"/>
    <rect x="390" y="480" width="14" height="28" rx="3" opacity="0.85"/>
    <rect x="410" y="480" width="14" height="28" rx="3" opacity="0.9"/>
    <rect x="430" y="480" width="14" height="28" rx="3"/>
    <rect x="450" y="480" width="14" height="28" rx="3"/>
  </g>

  <!-- 3. Akış işleyici -->
  <rect x="552" y="436" width="208" height="96" rx="10" fill="url(#procGrad)" filter="url(#shadow)"/>
  <text x="656" y="476" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Akış işleyici</text>
  <text x="656" y="498" font-size="13" text-anchor="middle" fill="#ffffff">(Spark Streaming, Flink)</text>

  <!-- 4. Anlık uyarı / canlı pano -->
  <rect x="802" y="444" width="146" height="80" rx="10" fill="url(#outGrad)" filter="url(#shadow)"/>
  <text x="875" y="479" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Anlık uyarı /</text>
  <text x="875" y="500" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Canlı pano</text>

  <!-- Gecikme -->
  <line x1="962" y1="412" x2="962" y2="562" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="984" y="452" width="180" height="64" rx="12" fill="#cffafe" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="1074" y="477" font-size="14" font-weight="600" text-anchor="middle" fill="#0e7490">Gecikme:</text>
  <text x="1074" y="500" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">milisaniyeler – saniyeler</text>

  <text x="391" y="566" font-size="13" text-anchor="middle" fill="#0e7490" font-weight="600">olayları sırayla ve kalıcı olarak tamponlar</text>

  <!-- ===================== MİMARİLER ===================== -->
  <rect x="80" y="612" width="1040" height="86" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="645" font-size="15" text-anchor="middle" fill="#1f2937"><tspan font-weight="bold" fill="#5b21b6">Lambda mimarisi</tspan> = Batch katmanı + Hız (stream) katmanı + Sunum katmanı</text>
  <text x="600" y="676" font-size="15" text-anchor="middle" fill="#1f2937"><tspan font-weight="bold" fill="#5b21b6">Kappa mimarisi</tspan> = Her şey tek akış hattı üzerinden</text>
</svg>
