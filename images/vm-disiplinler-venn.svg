<!-- Şekil: Veri madenciliğini besleyen disiplinler (Venn şeması) | Ders notu: Veri Madenciliği ve Büyük Veri -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="830" viewBox="0 0 1100 830" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gradCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.18"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font-size: 24px; font-weight: bold; fill: #111827; }
      .subtitle { font-size: 14px; fill: #4b5563; }
      .setLabel { font-size: 18px; font-weight: bold; text-anchor: middle; }
      .setDesc { font-size: 13px; fill: #4b5563; text-anchor: middle; }
      .pair { font-size: 14px; font-weight: 600; fill: #1f2937; text-anchor: middle; }
      .link { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
      .pill { fill: #ffffff; stroke: #6b7280; stroke-width: 1.2; }
      .pillText { font-size: 14px; fill: #1f2937; text-anchor: middle; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Başlık -->
  <text x="550" y="44" text-anchor="middle" class="title">Veri Madenciliği: Disiplinlerin Kesişimi</text>
  <text x="550" y="70" text-anchor="middle" class="subtitle">Veri madenciliği istatistik, makine öğrenmesi ve veritabanı sistemlerinin ortak alanında yer alır</text>

  <!-- Merkeze bağlanan kesikli çizgiler (dairelerin altında) -->
  <line x1="190" y1="433" x2="550" y2="433" class="link"/>
  <line x1="908" y1="433" x2="550" y2="433" class="link"/>
  <line x1="375" y1="146" x2="550" y2="433" class="link"/>
  <line x1="725" y1="146" x2="550" y2="433" class="link"/>
  <line x1="725" y1="777" x2="550" y2="433" class="link"/>

  <!-- Venn daireleri -->
  <circle cx="440" cy="370" r="200" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="660" cy="370" r="200" fill="#8b5cf6" fill-opacity="0.22" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="550" cy="560" r="200" fill="#10b981" fill-opacity="0.22" stroke="#10b981" stroke-width="2"/>

  <!-- Küme adları -->
  <text x="335" y="295" class="setLabel" fill="#1e40af">İstatistik</text>
  <text x="335" y="318" class="setDesc">olasılık · çıkarım · test</text>

  <text x="750" y="285" class="setLabel" fill="#5b21b6" style="font-size:16px">Makine Öğrenmesi /</text>
  <text x="750" y="307" class="setLabel" fill="#5b21b6" style="font-size:16px">Yapay Zekâ</text>
  <text x="750" y="329" class="setDesc">öğrenen algoritmalar</text>

  <text x="545" y="632" class="setLabel" fill="#047857">Veritabanı ve</text>
  <text x="545" y="654" class="setLabel" fill="#047857">Büyük Veri</text>
  <text x="545" y="676" class="setLabel" fill="#047857">Sistemleri</text>
  <text x="545" y="698" class="setDesc">depolama · sorgu · ölçek</text>

  <!-- İkili kesişimler -->
  <text x="550" y="270" class="pair">İstatistiksel</text>
  <text x="550" y="289" class="pair">öğrenme</text>

  <text x="432" y="492" class="pair">Keşifsel veri</text>
  <text x="432" y="511" class="pair">analizi / OLAP</text>

  <text x="668" y="492" class="pair">Ölçeklenebilir</text>
  <text x="668" y="511" class="pair">öğrenme</text>

  <!-- Merkez kesişim -->
  <rect x="482" y="403" width="136" height="60" rx="14" fill="url(#gradCore)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="428" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Veri</text>
  <text x="550" y="449" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Madenciliği</text>

  <!-- Çevredeki ilgili alanlar -->
  <rect x="70" y="417" width="120" height="32" rx="16" class="pill" filter="url(#shadow)"/>
  <text x="130" y="438" class="pillText">Alan Bilgisi</text>

  <rect x="908" y="417" width="124" height="32" rx="16" class="pill" filter="url(#shadow)"/>
  <text x="970" y="438" class="pillText">Bilgi Erişimi</text>

  <rect x="306" y="114" width="138" height="32" rx="16" class="pill" filter="url(#shadow)"/>
  <text x="375" y="135" class="pillText">Görselleştirme</text>

  <rect x="658" y="114" width="134" height="32" rx="16" class="pill" filter="url(#shadow)"/>
  <text x="725" y="135" class="pillText">Örüntü Tanıma</text>

  <rect x="612" y="777" width="226" height="32" rx="16" class="pill" filter="url(#shadow)"/>
  <text x="725" y="798" class="pillText">Yüksek Başarımlı Hesaplama</text>
</svg>
