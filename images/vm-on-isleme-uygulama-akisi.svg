<!-- Şekil: Veri ön işleme uygulamasının akışı | Ders notu: Veri Madenciliği ve Büyük Veri -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.15"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <style>
      .title { font-size: 24px; font-weight: bold; fill: #111827; }
      .subtitle { font-size: 14px; fill: #4b5563; }
      .cardTitle { font-size: 16px; font-weight: bold; fill: #ffffff; }
      .item { font-size: 13.5px; fill: #1f2937; }
      .fileName { font-size: 14px; font-weight: bold; fill: #1f2937; text-anchor: middle; }
      .fileSub { font-size: 12.5px; fill: #4b5563; text-anchor: middle; }
      .legend { font-size: 13.5px; fill: #1f2937; }
      .flow { stroke: #6b7280; stroke-width: 2.5; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="600" y="36" text-anchor="middle" class="title">Veri Ön İşleme Uygulamasının Akışı</text>
  <text x="600" y="60" text-anchor="middle" class="subtitle">python/on_isleme.py ve r/on_isleme.R aynı sekiz adımı aynı kurallarla uygular; renkler Han'ın dört ön işleme aşamasını gösterir</text>

  <!-- Girdi: müşteri dosyası -->
  <g filter="url(#shadow)">
    <rect x="20" y="190" width="170" height="100" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <path d="M 20 214 V 198 Q 20 190 28 190 H 182 Q 190 190 190 198 V 214 Z" fill="#ef4444"/>
  </g>
  <text x="105" y="207" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">GİRDİ (CRM)</text>
  <text x="105" y="242" class="fileName">musteriler_kirli.csv</text>
  <text x="105" y="264" class="fileSub">316 satır × 15 sütun</text>

  <!-- Girdi: sipariş dosyası -->
  <g filter="url(#shadow)">
    <rect x="735" y="78" width="170" height="52" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  </g>
  <text x="820" y="100" class="fileName">siparisler.csv</text>
  <text x="820" y="119" class="fileSub">1110 satır × 4 sütun</text>
  <path d="M 820 131 V 148" class="flow" marker-end="url(#arrow)"/>

  <!-- 1. Veriyi tanıma -->
  <g filter="url(#shadow)">
    <rect x="230" y="150" width="220" height="180" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <path d="M 230 186 V 160 Q 230 150 240 150 H 440 Q 450 150 450 160 V 186 Z" fill="#6b7280"/>
  </g>
  <text x="244" y="174" class="cardTitle">1  Veriyi tanıma</text>
  <text x="246" y="212" class="item">• Tahmin edilen sütun tipleri</text>
  <text x="246" y="236" class="item">• Kaç farklı yazım var?</text>
  <text x="246" y="260" class="item">• Boş hücre sayısı</text>
  <text x="246" y="284" class="item">• Mükerrer satır / anahtar</text>

  <!-- 2. Temizleme -->
  <g filter="url(#shadow)">
    <rect x="470" y="150" width="220" height="180" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <path d="M 470 186 V 160 Q 470 150 480 150 H 680 Q 690 150 690 160 V 186 Z" fill="#ef4444"/>
  </g>
  <text x="484" y="174" class="cardTitle">2  Veri temizleme</text>
  <text x="486" y="212" class="item">• Gizli eksikler ("?", "-") → NA</text>
  <text x="486" y="236" class="item">• Yazım birliği: 33 → 6 şehir</text>
  <text x="486" y="260" class="item">• Metin → sayı ve tarih</text>
  <text x="486" y="284" class="item">• Mükerrer kayıtları silme</text>
  <text x="486" y="308" class="item">• İş kuralı ihlalleri → NA</text>

  <!-- 3. Bütünleştirme -->
  <g filter="url(#shadow)">
    <rect x="710" y="150" width="220" height="180" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
    <path d="M 710 186 V 160 Q 710 150 720 150 H 920 Q 930 150 930 160 V 186 Z" fill="#8b5cf6"/>
  </g>
  <text x="724" y="174" class="cardTitle">3  Bütünleştirme</text>
  <text x="726" y="212" class="item">• Anahtar: C-1001 = 1001</text>
  <text x="726" y="236" class="item">• Para birimi: USD → TL</text>
  <text x="726" y="260" class="item">• Siparişleri toplulaştırma</text>
  <text x="726" y="284" class="item">• Left join, yetim kayıtlar</text>
  <text x="726" y="308" class="item">• Korelasyon ve χ² testi</text>

  <!-- 4. Aykırı değerler -->
  <g filter="url(#shadow)">
    <rect x="950" y="150" width="220" height="180" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <path d="M 950 186 V 160 Q 950 150 960 150 H 1160 Q 1170 150 1170 160 V 186 Z" fill="#ef4444"/>
  </g>
  <text x="964" y="174" class="cardTitle">4  Aykırı değerler</text>
  <text x="966" y="212" class="item">• IQR (Tukey) kuralı</text>
  <text x="966" y="236" class="item">• z-skor ve maskeleme</text>
  <text x="966" y="260" class="item">• Hata mı, gerçek mi?</text>
  <text x="966" y="284" class="item">• Baskılama (winsorizing)</text>

  <!-- 5. Eksik değerler -->
  <g filter="url(#shadow)">
    <rect x="950" y="390" width="220" height="180" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <path d="M 950 426 V 400 Q 950 390 960 390 H 1160 Q 1170 390 1170 400 V 426 Z" fill="#ef4444"/>
  </g>
  <text x="964" y="414" class="cardTitle">5  Eksik değerler</text>
  <text x="966" y="452" class="item">• Sütun ve satır silme</text>
  <text x="966" y="476" class="item">• Eksiklik rastgele mi? (MAR)</text>
  <text x="966" y="500" class="item">• Mod, medyan, grup medyanı</text>
  <text x="966" y="524" class="item">• k-NN ile karşılaştırma</text>

  <!-- 6. Dönüştürme -->
  <g filter="url(#shadow)">
    <rect x="710" y="390" width="220" height="180" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <path d="M 710 426 V 400 Q 710 390 720 390 H 920 Q 930 390 930 400 V 426 Z" fill="#3b82f6"/>
  </g>
  <text x="724" y="414" class="cardTitle">6  Dönüştürme</text>
  <text x="726" y="452" class="item">• Özellik türetme</text>
  <text x="726" y="476" class="item">• log(1 + x) dönüşümü</text>
  <text x="726" y="500" class="item">• Min-maks ve z-skor</text>
  <text x="726" y="524" class="item">• Ayrıklaştırma</text>
  <text x="726" y="548" class="item">• Sıralı ve one-hot kodlama</text>

  <!-- 7. İndirgeme -->
  <g filter="url(#shadow)">
    <rect x="470" y="390" width="220" height="180" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
    <path d="M 470 426 V 400 Q 470 390 480 390 H 680 Q 690 390 690 400 V 426 Z" fill="#10b981"/>
  </g>
  <text x="484" y="414" class="cardTitle">7  İndirgeme</text>
  <text x="486" y="452" class="item">• Sabit sütunu silme</text>
  <text x="486" y="476" class="item">• Kimlik sütunlarını ayırma</text>
  <text x="486" y="500" class="item">• PCA: açıklanan varyans</text>
  <text x="486" y="524" class="item">• Tabakalı örnekleme</text>

  <!-- 8. Kaydetme -->
  <g filter="url(#shadow)">
    <rect x="230" y="390" width="220" height="180" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <path d="M 230 426 V 400 Q 230 390 240 390 H 440 Q 450 390 450 400 V 426 Z" fill="#6b7280"/>
  </g>
  <text x="244" y="414" class="cardTitle">8  Kaydetme ve rapor</text>
  <text x="246" y="452" class="item">• Okunabilir temiz tablo</text>
  <text x="246" y="476" class="item">• Modele hazır tablo</text>
  <text x="246" y="500" class="item">• Önce / sonra kalite raporu</text>
  <text x="246" y="524" class="item">• 10 grafik (PNG)</text>

  <!-- Çıktılar -->
  <g filter="url(#shadow)">
    <rect x="20" y="390" width="170" height="180" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
    <path d="M 20 414 V 398 Q 20 390 28 390 H 182 Q 190 390 190 398 V 414 Z" fill="#10b981"/>
  </g>
  <text x="105" y="407" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">ÇIKTI</text>
  <text x="105" y="448" class="fileName">musteriler_temiz.csv</text>
  <text x="105" y="468" class="fileSub">295 satır × 14 sütun</text>
  <line x1="40" y1="490" x2="170" y2="490" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="105" y="518" class="fileName">musteriler_model.csv</text>
  <text x="105" y="538" class="fileSub">295 satır × 17 sütun</text>

  <!-- Akış okları -->
  <path d="M 191 240 H 228" class="flow" marker-end="url(#arrow)"/>
  <path d="M 451 240 H 468" class="flow" marker-end="url(#arrow)"/>
  <path d="M 691 240 H 708" class="flow" marker-end="url(#arrow)"/>
  <path d="M 931 240 H 948" class="flow" marker-end="url(#arrow)"/>
  <path d="M 1060 331 V 388" class="flow" marker-end="url(#arrow)"/>
  <path d="M 949 480 H 932" class="flow" marker-end="url(#arrow)"/>
  <path d="M 709 480 H 692" class="flow" marker-end="url(#arrow)"/>
  <path d="M 469 480 H 452" class="flow" marker-end="url(#arrow)"/>
  <path d="M 229 480 H 192" class="flow" marker-end="url(#arrow)"/>

  <!-- Lejant -->
  <rect x="226" y="610" width="16" height="16" rx="3" fill="#ef4444"/>
  <text x="250" y="623" class="legend">Veri temizleme</text>
  <rect x="396" y="610" width="16" height="16" rx="3" fill="#8b5cf6"/>
  <text x="420" y="623" class="legend">Veri bütünleştirme</text>
  <rect x="586" y="610" width="16" height="16" rx="3" fill="#3b82f6"/>
  <text x="610" y="623" class="legend">Veri dönüştürme</text>
  <rect x="760" y="610" width="16" height="16" rx="3" fill="#10b981"/>
  <text x="784" y="623" class="legend">Veri indirgeme</text>
  <rect x="922" y="610" width="16" height="16" rx="3" fill="#6b7280"/>
  <text x="946" y="623" class="legend">Tanıma / raporlama</text>
</svg>
