<!-- Şekil: Dersin yol haritası (Kısım I ve Kısım II aşamaları) | Ders notu: Veri Madenciliği ve Büyük Veri -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="regionBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="regionAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.15"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <style>
      .title { font-size: 24px; font-weight: bold; fill: #111827; }
      .subtitle { font-size: 14px; fill: #4b5563; }
      .card { fill: #ffffff; stroke-width: 1.5; }
      .cardTitle { font-size: 16px; font-weight: bold; fill: #ffffff; }
      .num { font-size: 18px; font-weight: bold; text-anchor: middle; }
      .item { font-size: 15px; fill: #1f2937; }
      .region { font-size: 15px; font-weight: bold; }
      .flow { stroke: #6b7280; stroke-width: 2.5; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Başlık -->
  <text x="600" y="44" text-anchor="middle" class="title">Dersin Yol Haritası</text>
  <text x="600" y="70" text-anchor="middle" class="subtitle">Veri Madenciliğinde İleri Konular ve Büyük Veri — konuların önerilen işleniş sırası</text>

  <!-- KISIM I bölgesi -->
  <rect x="30" y="95" width="1140" height="280" rx="18" fill="url(#regionBlue)" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="48" y="106" width="250" height="26" rx="13" fill="#3b82f6"/>
  <text x="173" y="124" text-anchor="middle" class="region" fill="#ffffff">Kısım I: Veri Madenciliği</text>

  <!-- KISIM II bölgesi -->
  <rect x="314" y="425" width="572" height="280" rx="18" fill="url(#regionAmber)" stroke="#fcd34d" stroke-width="1.5"/>
  <rect x="568" y="436" width="300" height="26" rx="13" fill="#d97706"/>
  <text x="718" y="454" text-anchor="middle" class="region" fill="#ffffff">Kısım II: Büyük Veri Teknolojileri</text>

  <!-- Akış okları (satır 1) -->
  <line x1="298" y1="247" x2="334" y2="247" class="flow" marker-end="url(#arrow)"/>
  <line x1="582" y1="247" x2="618" y2="247" class="flow" marker-end="url(#arrow)"/>
  <line x1="866" y1="247" x2="902" y2="247" class="flow" marker-end="url(#arrow)"/>
  <!-- ④ → ⑤ geçiş oku -->
  <path d="M 1026 357 L 1026 388 Q 1026 400 1014 400 L 470 400 Q 458 400 458 412 L 458 466" class="flow" marker-end="url(#arrow)"/>
  <!-- Satır 2 -->
  <line x1="582" y1="577" x2="618" y2="577" class="flow" marker-end="url(#arrow)"/>

  <!-- ① -->
  <g transform="translate(54,140)">
    <rect width="240" height="215" rx="12" class="card" stroke="#93c5fd" filter="url(#shadow)"/>
    <path d="M 0 64 V 12 Q 0 0 12 0 H 228 Q 240 0 240 12 V 64 Z" fill="url(#gradBlue)"/>
    <circle cx="32" cy="32" r="18" fill="#ffffff"/>
    <text x="32" y="38" class="num" fill="#2563eb">1</text>
    <text x="60" y="28" class="cardTitle">Veri Madenciliği</text>
    <text x="60" y="48" class="cardTitle">Temelleri</text>
    <g class="item">
      <circle cx="22" cy="89" r="3.5" fill="#3b82f6"/><text x="34" y="94">Süreç modelleri</text>
      <circle cx="22" cy="113" r="3.5" fill="#3b82f6"/><text x="34" y="118">Veriyi tanıma</text>
      <circle cx="22" cy="137" r="3.5" fill="#3b82f6"/><text x="34" y="142">Ön işleme</text>
      <circle cx="22" cy="161" r="3.5" fill="#3b82f6"/><text x="34" y="166">Veri ambarı</text>
    </g>
  </g>

  <!-- ② -->
  <g transform="translate(338,140)">
    <rect width="240" height="215" rx="12" class="card" stroke="#93c5fd" filter="url(#shadow)"/>
    <path d="M 0 64 V 12 Q 0 0 12 0 H 228 Q 240 0 240 12 V 64 Z" fill="url(#gradBlue)"/>
    <circle cx="32" cy="32" r="18" fill="#ffffff"/>
    <text x="32" y="38" class="num" fill="#2563eb">2</text>
    <text x="60" y="28" class="cardTitle">Temel Görevler ve</text>
    <text x="60" y="48" class="cardTitle">Algoritmalar</text>
    <g class="item">
      <circle cx="22" cy="89" r="3.5" fill="#3b82f6"/><text x="34" y="94">Birliktelik kuralları</text>
      <circle cx="22" cy="113" r="3.5" fill="#3b82f6"/><text x="34" y="118">Sınıflandırma</text>
      <circle cx="22" cy="137" r="3.5" fill="#3b82f6"/><text x="34" y="142">Değerlendirme</text>
      <circle cx="22" cy="161" r="3.5" fill="#3b82f6"/><text x="34" y="166">Kümeleme</text>
      <circle cx="22" cy="185" r="3.5" fill="#3b82f6"/><text x="34" y="190">Aykırı değer</text>
    </g>
  </g>

  <!-- ③ -->
  <g transform="translate(622,140)">
    <rect width="240" height="215" rx="12" class="card" stroke="#93c5fd" filter="url(#shadow)"/>
    <path d="M 0 64 V 12 Q 0 0 12 0 H 228 Q 240 0 240 12 V 64 Z" fill="url(#gradBlue)"/>
    <circle cx="32" cy="32" r="18" fill="#ffffff"/>
    <text x="32" y="38" class="num" fill="#2563eb">3</text>
    <text x="60" y="38" class="cardTitle">İleri Konular</text>
    <g class="item">
      <circle cx="22" cy="89" r="3.5" fill="#3b82f6"/><text x="34" y="94">Topluluk öğrenme</text>
      <circle cx="22" cy="113" r="3.5" fill="#3b82f6"/><text x="34" y="118">Dengesiz veri</text>
      <circle cx="22" cy="137" r="3.5" fill="#3b82f6"/><text x="34" y="142">Metin / graf madenciliği</text>
      <circle cx="22" cy="161" r="3.5" fill="#3b82f6"/><text x="34" y="166">Veri akışları</text>
    </g>
  </g>

  <!-- ④ -->
  <g transform="translate(906,140)">
    <rect width="240" height="215" rx="12" class="card" stroke="#93c5fd" filter="url(#shadow)"/>
    <path d="M 0 64 V 12 Q 0 0 12 0 H 228 Q 240 0 240 12 V 64 Z" fill="url(#gradBlue)"/>
    <circle cx="32" cy="32" r="18" fill="#ffffff"/>
    <text x="32" y="38" class="num" fill="#2563eb">4</text>
    <text x="60" y="28" class="cardTitle">Büyük Veriye</text>
    <text x="60" y="48" class="cardTitle">Geçiş</text>
    <g class="item">
      <circle cx="22" cy="89" r="3.5" fill="#3b82f6"/><text x="34" y="94">Ölçekleme</text>
      <circle cx="22" cy="113" r="3.5" fill="#3b82f6"/><text x="34" y="118">Sharding</text>
      <circle cx="22" cy="137" r="3.5" fill="#3b82f6"/><text x="34" y="142">CAP teoremi</text>
      <circle cx="22" cy="161" r="3.5" fill="#3b82f6"/><text x="34" y="166">Batch / Stream</text>
      <circle cx="22" cy="185" r="3.5" fill="#3b82f6"/><text x="34" y="190">Etik</text>
    </g>
  </g>

  <!-- ⑤ -->
  <g transform="translate(338,470)">
    <rect width="240" height="215" rx="12" class="card" stroke="#fcd34d" filter="url(#shadow)"/>
    <path d="M 0 64 V 12 Q 0 0 12 0 H 228 Q 240 0 240 12 V 64 Z" fill="url(#gradAmber)"/>
    <circle cx="32" cy="32" r="18" fill="#ffffff"/>
    <text x="32" y="38" class="num" fill="#d97706">5</text>
    <text x="60" y="38" class="cardTitle">Hadoop Altyapısı</text>
    <g class="item">
      <circle cx="22" cy="89" r="3.5" fill="#f59e0b"/><text x="34" y="94">HDFS</text>
      <circle cx="22" cy="113" r="3.5" fill="#f59e0b"/><text x="34" y="118">YARN</text>
      <circle cx="22" cy="137" r="3.5" fill="#f59e0b"/><text x="34" y="142">MapReduce</text>
      <circle cx="22" cy="161" r="3.5" fill="#f59e0b"/><text x="34" y="166">Kurulum</text>
    </g>
  </g>

  <!-- ⑥ -->
  <g transform="translate(622,470)">
    <rect width="240" height="215" rx="12" class="card" stroke="#fcd34d" filter="url(#shadow)"/>
    <path d="M 0 64 V 12 Q 0 0 12 0 H 228 Q 240 0 240 12 V 64 Z" fill="url(#gradAmber)"/>
    <circle cx="32" cy="32" r="18" fill="#ffffff"/>
    <text x="32" y="38" class="num" fill="#d97706">6</text>
    <text x="60" y="28" class="cardTitle">Ekosistem ve</text>
    <text x="60" y="48" class="cardTitle">Spark</text>
    <g class="item">
      <circle cx="22" cy="89" r="3.5" fill="#f59e0b"/><text x="34" y="94">Hive</text>
      <circle cx="22" cy="113" r="3.5" fill="#f59e0b"/><text x="34" y="118">Pig</text>
      <circle cx="22" cy="137" r="3.5" fill="#f59e0b"/><text x="34" y="142">Mahout</text>
      <circle cx="22" cy="161" r="3.5" fill="#f59e0b"/><text x="34" y="166">Spark</text>
    </g>
  </g>

  <!-- Dipnot -->
  <text x="600" y="728" text-anchor="middle" font-size="13" fill="#4b5563">Kısım I’de kazanılan kavramlar, Kısım II’de büyük ölçekli araçlarla yeniden ele alınır.</text>
</svg>
