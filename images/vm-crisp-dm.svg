<!-- Şekil: CRISP-DM süreç modeli | Ders notu: Veri Madenciliği ve Büyük Veri -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="910" viewBox="0 0 1100 910" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gradCyl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.15"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowRing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <style>
      .title { font-size: 24px; font-weight: bold; fill: #111827; }
      .subtitle { font-size: 14px; fill: #4b5563; }
      .boxTitle { font-size: 16px; font-weight: bold; fill: #1f2937; text-anchor: middle; }
      .boxSub { font-size: 13px; fill: #4b5563; text-anchor: middle; }
      .num { font-size: 16px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .flow { stroke: #6b7280; stroke-width: 2.5; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="550" y="44" text-anchor="middle" class="title">CRISP-DM: Veri Madenciliği için Çapraz Endüstri Standart Süreci</text>
  <text x="550" y="70" text-anchor="middle" class="subtitle">Cross-Industry Standard Process for Data Mining — altı aşamalı, yinelemeli yaşam döngüsü</text>

  <!-- Dış döngü: süreç yinelenir -->
  <path d="M 636.8 103.7 A 500 372 0 1 1 446.0 106.1" fill="none" stroke="#d1d5db" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowRing)"/>
  <text x="550" y="103" text-anchor="middle" font-size="14" font-style="italic" fill="#6b7280">döngü yinelenir</text>

  <!-- Aşama okları -->
  <line x1="519" y1="240" x2="581" y2="240" class="flow" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="760" y1="279" x2="842" y2="429" class="flow" marker-end="url(#arrow)"/>
  <line x1="842" y1="511" x2="760" y2="661" class="flow" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="581" y1="700" x2="519" y2="700" class="flow" marker-end="url(#arrow)"/>
  <line x1="420" y1="661" x2="420" y2="279" class="flow" marker-end="url(#arrow)"/>
  <line x1="330" y1="661" x2="252" y2="511" class="flow" marker-end="url(#arrow)"/>

  <!-- Merkez: Veri -->
  <g transform="translate(550,470)" filter="url(#shadow)">
    <path d="M -72 -48 L -72 48 A 72 18 0 0 0 72 48 L 72 -48 Z" fill="url(#gradCyl)" stroke="#1e40af" stroke-width="1.5"/>
    <path d="M -72 -14 A 72 18 0 0 0 72 -14" fill="none" stroke="#1e40af" stroke-width="1.2" opacity="0.6"/>
    <path d="M -72 18 A 72 18 0 0 0 72 18" fill="none" stroke="#1e40af" stroke-width="1.2" opacity="0.6"/>
    <ellipse cx="0" cy="-48" rx="72" ry="18" fill="#bfdbfe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="0" y="12" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Veri</text>
  </g>

  <!-- Aşama kutuları -->
  <g transform="translate(390,240)">
    <rect x="-125" y="-35" width="250" height="70" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="-97" cy="0" r="17" fill="#3b82f6"/>
    <text x="-97" y="6" class="num">1</text>
    <text x="14" y="-4" class="boxTitle">1. İş Anlayışı</text>
    <text x="14" y="17" class="boxSub">(Business Understanding)</text>
  </g>
  <g transform="translate(710,240)">
    <rect x="-125" y="-35" width="250" height="70" rx="12" fill="#cffafe" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="-97" cy="0" r="17" fill="#06b6d4"/>
    <text x="-97" y="6" class="num">2</text>
    <text x="14" y="-4" class="boxTitle">2. Veri Anlayışı</text>
    <text x="14" y="17" class="boxSub">(Data Understanding)</text>
  </g>
  <g transform="translate(880,470)">
    <rect x="-125" y="-35" width="250" height="70" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)"/>
    <circle cx="-97" cy="0" r="17" fill="#f59e0b"/>
    <text x="-97" y="6" class="num">3</text>
    <text x="14" y="-4" class="boxTitle">3. Veri Hazırlama</text>
    <text x="14" y="17" class="boxSub">(Data Preparation)</text>
  </g>
  <g transform="translate(710,700)">
    <rect x="-125" y="-35" width="250" height="70" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="-97" cy="0" r="17" fill="#8b5cf6"/>
    <text x="-97" y="6" class="num">4</text>
    <text x="14" y="-4" class="boxTitle">4. Modelleme</text>
    <text x="14" y="17" class="boxSub">(Modeling)</text>
  </g>
  <g transform="translate(390,700)">
    <rect x="-125" y="-35" width="250" height="70" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="-97" cy="0" r="17" fill="#10b981"/>
    <text x="-97" y="6" class="num">5</text>
    <text x="14" y="-4" class="boxTitle">5. Değerlendirme</text>
    <text x="14" y="17" class="boxSub">(Evaluation)</text>
  </g>
  <g transform="translate(220,470)">
    <rect x="-125" y="-35" width="250" height="70" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="-97" cy="0" r="17" fill="#ef4444"/>
    <text x="-97" y="6" class="num">6</text>
    <text x="14" y="-4" class="boxTitle">6. Dağıtım</text>
    <text x="14" y="17" class="boxSub">(Deployment)</text>
  </g>
  <rect x="947" y="421" width="76" height="26" rx="13" fill="#d97706" filter="url(#shadow)"/>
  <text x="985" y="439" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">%60–80</text>

  <!-- Not -->
  <rect x="260" y="862" width="580" height="34" rx="17" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <circle cx="284" cy="879" r="9" fill="none" stroke="#b45309" stroke-width="2"/>
  <path d="M 284 873 L 284 879 L 289 882" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <text x="560" y="884" text-anchor="middle" font-size="14" fill="#78350f">Projelerde zamanın <tspan font-weight="bold">%60–80</tspan>’i <tspan font-weight="bold">Veri Hazırlama</tspan>’ya gider</text>
</svg>
