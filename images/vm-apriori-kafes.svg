<!-- Şekil: Apriori ilkesi ve öğe kümesi kafesi (itemset lattice) | Ders notu: Veri Madenciliği ve Büyük Veri -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f9fafb"/>
    </linearGradient>
    <linearGradient id="freqGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="infreqGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.13"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Başlık -->
  <text x="600" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#111827">Apriori İlkesi: Öğe Kümesi Kafesinde Budama</text>
  <text x="600" y="66" font-size="14" text-anchor="middle" fill="#4b5563">{A, B, C, D} öğeleri için tüm olası öğe kümeleri (itemset lattice) — {A, B} seyrek çıktığında</text>

  <!-- Seviye bantları ve etiketleri -->
  <g font-size="14" font-weight="600" fill="#4b5563">
    <rect x="20" y="118" width="830" height="44" rx="8" fill="#f3f4f6" opacity="0.6"/>
    <rect x="20" y="228" width="830" height="44" rx="8" fill="#f3f4f6" opacity="0.6"/>
    <rect x="20" y="338" width="830" height="44" rx="8" fill="#f3f4f6" opacity="0.6"/>
    <rect x="20" y="448" width="830" height="44" rx="8" fill="#f3f4f6" opacity="0.6"/>
    <rect x="20" y="558" width="830" height="44" rx="8" fill="#f3f4f6" opacity="0.6"/>
    <text x="32" y="145">Boş küme</text>
    <text x="32" y="255">1-öğe kümeleri</text>
    <text x="32" y="365">2-öğe kümeleri</text>
    <text x="32" y="475">3-öğe kümeleri</text>
    <text x="32" y="585">4-öğe kümesi</text>
  </g>

  <!-- Budanan bölge -->
  <path d="M 248 436 L 512 436 L 594 548 L 594 614 L 488 614 L 420 504 L 248 504 Z"
        fill="#fee2e2" fill-opacity="0.8" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 4" stroke-linejoin="round"/>
  <rect x="88" y="512" width="150" height="28" rx="14" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="163" y="531" font-size="14" font-weight="bold" text-anchor="middle" fill="#b91c1c">Budandı (pruned)</text>
  <line x1="238" y1="520" x2="256" y2="504" stroke="#ef4444" stroke-width="1.5"/>

  <!-- Kenarlar: sık adaylar arasındaki -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <!-- ∅ → 1-öğe -->
    <line x1="540" y1="162" x2="300" y2="228"/>
    <line x1="540" y1="162" x2="460" y2="228"/>
    <line x1="540" y1="162" x2="620" y2="228"/>
    <line x1="540" y1="162" x2="780" y2="228"/>
    <!-- 1-öğe → 2-öğe -->
    <line x1="300" y1="272" x2="252" y2="338"/>
    <line x1="300" y1="272" x2="367" y2="338"/>
    <line x1="300" y1="272" x2="482" y2="338"/>
    <line x1="460" y1="272" x2="252" y2="338"/>
    <line x1="460" y1="272" x2="597" y2="338"/>
    <line x1="460" y1="272" x2="712" y2="338"/>
    <line x1="620" y1="272" x2="367" y2="338"/>
    <line x1="620" y1="272" x2="597" y2="338"/>
    <line x1="620" y1="272" x2="827" y2="338"/>
    <line x1="780" y1="272" x2="482" y2="338"/>
    <line x1="780" y1="272" x2="712" y2="338"/>
    <line x1="780" y1="272" x2="827" y2="338"/>
    <!-- 2-öğe → 3-öğe (budanmayan) -->
    <line x1="367" y1="382" x2="620" y2="448"/>
    <line x1="482" y1="382" x2="620" y2="448"/>
    <line x1="597" y1="382" x2="780" y2="448"/>
    <line x1="712" y1="382" x2="780" y2="448"/>
    <line x1="827" y1="382" x2="620" y2="448"/>
    <line x1="827" y1="382" x2="780" y2="448"/>
  </g>
  <!-- Kenarlar: budanan düğümlere giden -->
  <g stroke="#d1a3a3" stroke-width="1.3" stroke-dasharray="4 3" fill="none">
    <line x1="252" y1="382" x2="300" y2="448"/>
    <line x1="252" y1="382" x2="460" y2="448"/>
    <line x1="367" y1="382" x2="300" y2="448"/>
    <line x1="482" y1="382" x2="460" y2="448"/>
    <line x1="597" y1="382" x2="300" y2="448"/>
    <line x1="712" y1="382" x2="460" y2="448"/>
    <line x1="300" y1="492" x2="540" y2="558"/>
    <line x1="460" y1="492" x2="540" y2="558"/>
    <line x1="620" y1="492" x2="540" y2="558"/>
    <line x1="780" y1="492" x2="540" y2="558"/>
  </g>

  <!-- Düğümler: sık aday -->
  <g font-size="17" font-weight="bold" text-anchor="middle" fill="#1e3a8a">
    <rect x="502" y="118" width="76" height="44" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="540" y="146" fill="#374151">∅</text>

    <rect x="262" y="228" width="76" height="44" rx="10" fill="url(#freqGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="300" y="256">A</text>
    <rect x="422" y="228" width="76" height="44" rx="10" fill="url(#freqGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="460" y="256">B</text>
    <rect x="582" y="228" width="76" height="44" rx="10" fill="url(#freqGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="620" y="256">C</text>
    <rect x="742" y="228" width="76" height="44" rx="10" fill="url(#freqGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="780" y="256">D</text>

    <rect x="329" y="338" width="76" height="44" rx="10" fill="url(#freqGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="367" y="366">AC</text>
    <rect x="444" y="338" width="76" height="44" rx="10" fill="url(#freqGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="482" y="366">AD</text>
    <rect x="559" y="338" width="76" height="44" rx="10" fill="url(#freqGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="597" y="366">BC</text>
    <rect x="674" y="338" width="76" height="44" rx="10" fill="url(#freqGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="712" y="366">BD</text>
    <rect x="789" y="338" width="76" height="44" rx="10" fill="url(#freqGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="827" y="366">CD</text>

    <rect x="582" y="448" width="76" height="44" rx="10" fill="url(#freqGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="620" y="476">ACD</text>
    <rect x="742" y="448" width="76" height="44" rx="10" fill="url(#freqGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="780" y="476">BCD</text>
  </g>

  <!-- Seyrek düğüm: AB -->
  <rect x="214" y="338" width="76" height="44" rx="10" fill="url(#infreqGrad)" stroke="#b91c1c" stroke-width="2" filter="url(#shadow)"/>
  <text x="252" y="366" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">AB</text>
  <rect x="88" y="288" width="150" height="28" rx="14" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="163" y="307" font-size="14" font-weight="bold" text-anchor="middle" fill="#b91c1c">Seyrek (infrequent)</text>
  <line x1="222" y1="316" x2="234" y2="336" stroke="#ef4444" stroke-width="1.5"/>

  <!-- Budanan düğümler -->
  <g font-size="17" font-weight="bold" text-anchor="middle" fill="#9ca3af">
    <rect x="262" y="448" width="76" height="44" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="300" y="476">ABC</text>
    <line x1="276" y1="470" x2="324" y2="470" stroke="#9ca3af" stroke-width="2"/>
    <rect x="422" y="448" width="76" height="44" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="460" y="476">ABD</text>
    <line x1="436" y1="470" x2="484" y2="470" stroke="#9ca3af" stroke-width="2"/>
    <rect x="502" y="558" width="76" height="44" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="540" y="586">ABCD</text>
    <line x1="512" y1="580" x2="568" y2="580" stroke="#9ca3af" stroke-width="2"/>
  </g>

  <!-- Yan kutu: Apriori ilkesi -->
  <g transform="translate(880, 118)">
    <rect x="0" y="0" width="295" height="230" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="295" height="42" rx="12" fill="#f59e0b"/>
    <rect x="0" y="30" width="295" height="12" fill="#f59e0b"/>
    <text x="147.5" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">Apriori İlkesi</text>
    <g font-size="15" fill="#78350f">
      <text x="18" y="72">Bir öğe kümesi sık değilse,</text>
      <text x="18" y="94">onun <tspan font-weight="bold">tüm üst kümeleri</tspan> de</text>
      <text x="18" y="116">sık olamaz.</text>
      <text x="18" y="150" font-weight="bold">→ Aday sayısı ciddi biçimde</text>
      <text x="18" y="172" font-weight="bold">azalır.</text>
    </g>
    <line x1="18" y1="190" x2="277" y2="190" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="18" y="214" font-size="13" fill="#92400e">Ör: {A,B} seyrek ⇒ ABC, ABD, ABCD sayılmaz.</text>
  </g>

  <!-- Gösterge -->
  <g transform="translate(880, 372)" font-size="14" fill="#1f2937">
    <rect x="0" y="0" width="295" height="160" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1" filter="url(#shadow)"/>
    <text x="18" y="28" font-size="15" font-weight="bold" fill="#111827">Gösterge</text>
    <rect x="18" y="44" width="40" height="24" rx="6" fill="url(#freqGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="70" y="61">Sık aday (frequent candidate)</text>
    <rect x="18" y="80" width="40" height="24" rx="6" fill="url(#infreqGrad)" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="70" y="97">Seyrek (infrequent)</text>
    <rect x="18" y="116" width="40" height="24" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 3"/>
    <line x1="26" y1="128" x2="50" y2="128" stroke="#9ca3af" stroke-width="2"/>
    <text x="70" y="133">Budandı (pruned) — sayılmaz</text>
  </g>

  <text x="1027" y="575" font-size="13" text-anchor="middle" fill="#4b5563">Aşağı inildikçe öğe kümeleri büyür</text>
  <text x="1027" y="594" font-size="13" text-anchor="middle" fill="#4b5563">(her kenar: alt küme → üst küme)</text>
</svg>
