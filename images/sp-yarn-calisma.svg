<!-- Şekil: Bir Spark uygulamasının YARN üzerinde çalışması (client modu) | Ders notu: Spark ve YARN ile Dağıtık Veri Madenciliği -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f9fafb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.15"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <g id="exec">
      <rect x="0" y="0" width="56" height="44" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="28" y="19" font-size="11" font-weight="bold" text-anchor="middle" fill="#5b21b6">Exec</text>
      <circle cx="18" cy="31" r="5" fill="#8b5cf6"/><circle cx="38" cy="31" r="5" fill="#8b5cf6"/>
    </g>
    <g id="blok">
      <rect x="0" y="0" width="30" height="22" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
    </g>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <text x="600" y="38" font-size="24" font-weight="bold" text-anchor="middle" fill="#111827">Bir Spark Uygulaması YARN Üzerinde Nasıl Çalışır?</text>
  <text x="600" y="62" font-size="14" text-anchor="middle" fill="#4b5563">client modu: driver, komutu yazdığımız makinede (sınıfta FX-Mini) çalışır; executor'ları YARN dağıtır</text>

  <!-- Driver -->
  <rect x="30" y="90" width="270" height="150" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="90" width="270" height="36" rx="12" fill="#10b981"/>
  <rect x="30" y="112" width="270" height="14" fill="#10b981"/>
  <text x="165" y="114" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Driver · FX-Mini</text>
  <text x="48" y="150" font-size="13" fill="#065f46">• SparkSession / SparkContext</text>
  <text x="48" y="172" font-size="13" fill="#065f46">• kodu iş → aşama → görev'e böler</text>
  <text x="48" y="194" font-size="13" fill="#065f46">• görevleri executor'lara dağıtır</text>
  <text x="48" y="216" font-size="13" fill="#065f46">• sonuçları toplar (collect)</text>

  <!-- ResourceManager -->
  <rect x="470" y="88" width="300" height="84" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d4ed8">ResourceManager · FX-Gigabyte</text>
  <text x="620" y="142" font-size="13" text-anchor="middle" fill="#374151">kümenin kaynak muhasebecisi</text>
  <text x="620" y="161" font-size="12" text-anchor="middle" fill="#6b7280">kimde ne kadar bellek/çekirdek boş?</text>

  <!-- NodeManager kutuları -->
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <rect x="330" y="330" width="270" height="270" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="330" y="330" width="270" height="32" rx="12" fill="#3b82f6"/><rect x="330" y="350" width="270" height="12" fill="#3b82f6"/>
    <text x="465" y="352">NodeManager · Gigabyte</text>
    <rect x="615" y="330" width="270" height="270" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="615" y="330" width="270" height="32" rx="12" fill="#10b981"/><rect x="615" y="350" width="270" height="12" fill="#10b981"/>
    <text x="750" y="352">NodeManager · Mini</text>
    <rect x="900" y="330" width="270" height="270" rx="12" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="900" y="330" width="270" height="32" rx="12" fill="#f59e0b"/><rect x="900" y="350" width="270" height="12" fill="#f59e0b"/>
    <text x="1035" y="352">NodeManager · Vento</text>
  </g>
  <g font-size="12" fill="#6b7280">
    <text x="345" y="384">konteynerler</text><text x="630" y="384">konteynerler</text><text x="915" y="384">konteynerler</text>
  </g>
  <use href="#exec" transform="translate(345, 394)"/><use href="#exec" transform="translate(407, 394)"/>
  <use href="#exec" transform="translate(469, 394)"/><use href="#exec" transform="translate(531, 394)"/>
  <use href="#exec" transform="translate(630, 394)"/><use href="#exec" transform="translate(692, 394)"/>
  <use href="#exec" transform="translate(915, 394)"/>
  <rect x="1085" y="394" width="70" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1120" y="413" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">AM</text>
  <text x="1120" y="429" font-size="10" text-anchor="middle" fill="#92400e">yönetici</text>

  <!-- DataNode + bloklar -->
  <g font-size="12" fill="#374151">
    <line x1="345" y1="470" x2="585" y2="470" stroke="#e5e7eb"/>
    <line x1="630" y1="470" x2="870" y2="470" stroke="#e5e7eb"/>
    <line x1="915" y1="470" x2="1155" y2="470" stroke="#e5e7eb"/>
    <text x="345" y="494" font-weight="bold">DataNode (HDFS blokları)</text>
    <text x="630" y="494" font-weight="bold">DataNode (HDFS blokları)</text>
    <text x="915" y="494" font-weight="bold">DataNode (HDFS blokları)</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#374151">
    <use href="#blok" transform="translate(345, 506)"/><text x="360" y="521">B1</text>
    <use href="#blok" transform="translate(380, 506)"/><text x="395" y="521">B2</text>
    <use href="#blok" transform="translate(415, 506)"/><text x="430" y="521">B4</text>
    <use href="#blok" transform="translate(450, 506)"/><text x="465" y="521">B5</text>
    <use href="#blok" transform="translate(630, 506)"/><text x="645" y="521">B1</text>
    <use href="#blok" transform="translate(665, 506)"/><text x="680" y="521">B3</text>
    <use href="#blok" transform="translate(700, 506)"/><text x="715" y="521">B5</text>
    <use href="#blok" transform="translate(915, 506)"/><text x="930" y="521">B2</text>
    <use href="#blok" transform="translate(950, 506)"/><text x="965" y="521">B3</text>
    <use href="#blok" transform="translate(985, 506)"/><text x="1000" y="521">B4</text>
  </g>
  <g font-size="12" fill="#6b7280">
    <text x="345" y="556">Görev, okuyacağı blok aynı</text><text x="345" y="574">makinedeyse oraya gönderilir</text>
    <text x="630" y="556">Her blok 2 farklı makinede:</text><text x="630" y="574">biri bozulsa veri kaybolmaz</text>
    <text x="915" y="556">Yerel blok yoksa veri ağ</text><text x="915" y="574">üzerinden okunur (daha yavaş)</text>
  </g>

  <!-- Oklar -->
  <line x1="300" y1="130" x2="466" y2="118" stroke="#4b5563" stroke-width="2.2" marker-end="url(#aGray)"/>
  <line x1="770" y1="150" x2="1128" y2="324" stroke="#4b5563" stroke-width="2.2" marker-end="url(#aGray)"/>
  <line x1="1150" y1="324" x2="774" y2="128" stroke="#4b5563" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <line x1="1120" y1="362" x2="1120" y2="390" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="600" y1="172" x2="470" y2="326" stroke="#4b5563" stroke-width="2.2" marker-end="url(#aGray)"/>
  <line x1="640" y1="172" x2="730" y2="326" stroke="#4b5563" stroke-width="2.2" marker-end="url(#aGray)"/>
  <path d="M 230 240 C 230 330, 280 420, 340 416" fill="none" stroke="#7c3aed" stroke-width="3" marker-start="url(#aPurple)" marker-end="url(#aPurple)"/>

  <g font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="384" cy="113" r="13" fill="#111827"/><text x="384" y="118">1</text>
    <circle cx="930" cy="252" r="13" fill="#111827"/><text x="930" y="257">2</text>
    <circle cx="975" cy="208" r="13" fill="#6b7280"/><text x="975" y="213">3</text>
    <circle cx="535" cy="250" r="13" fill="#111827"/><text x="535" y="255">4</text>
    <circle cx="245" cy="330" r="13" fill="#7c3aed"/><text x="245" y="335">5</text>
  </g>

  <!-- Adım açıklamaları -->
  <rect x="30" y="440" width="280" height="196" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <g font-size="12.5" fill="#374151">
    <text x="44" y="464"><tspan font-weight="bold">1</tspan> spark-submit: driver RM'den uygulama ister</text>
    <text x="44" y="488"><tspan font-weight="bold">2</tspan> RM, bir düğümde ApplicationMaster açar</text>
    <text x="44" y="512"><tspan font-weight="bold">3</tspan> AM, RM'den executor konteyneri ister</text>
    <text x="44" y="536"><tspan font-weight="bold">4</tspan> RM, boş yeri olan NodeManager'lara</text>
    <text x="58" y="554">executor'ları başlatır</text>
    <text x="44" y="578"><tspan font-weight="bold" fill="#7c3aed">5</tspan> executor'lar driver'a kaydolur; driver</text>
    <text x="58" y="596">görevleri gönderir, sonuçları toplar</text>
    <text x="44" y="620" fill="#6b7280">Veri driver'dan geçmez: HDFS → executor</text>
  </g>
</svg>
