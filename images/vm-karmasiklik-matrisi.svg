<!-- Şekil: Karmaşıklık matrisi (confusion matrix) ve başarım ölçütleri | Ders notu: Veri Madenciliği ve Büyük Veri -->
<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="630" viewBox="0 0 1150 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f9fafb"/>
    </linearGradient>
    <linearGradient id="greenCell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="redCell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="amberCell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.12"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Başlık -->
  <text x="575" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#111827">Karmaşıklık Matrisi ve Başarım Ölçütleri</text>
  <text x="575" y="66" font-size="14" text-anchor="middle" fill="#4b5563">İkili sınıflandırmada gerçek ve tahmin edilen sınıfların karşılaştırılması</text>

  <!-- ================= SOL: MATRİS ================= -->
  <text x="373" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">Karmaşıklık Matrisi (Confusion Matrix)</text>

  <!-- Sütun başlığı -->
  <rect x="160" y="120" width="426" height="28" rx="6" fill="#e5e7eb"/>
  <text x="373" y="139" font-size="15" font-weight="bold" text-anchor="middle" fill="#374151">Tahmin Edilen Sınıf</text>
  <rect x="160" y="154" width="210" height="26" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="265" y="172" font-size="14" font-weight="600" text-anchor="middle" fill="#374151">Pozitif</text>
  <rect x="376" y="154" width="210" height="26" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="481" y="172" font-size="14" font-weight="600" text-anchor="middle" fill="#374151">Negatif</text>

  <!-- Satır başlığı -->
  <rect x="34" y="186" width="28" height="346" rx="6" fill="#e5e7eb"/>
  <text x="53" y="359" font-size="15" font-weight="bold" text-anchor="middle" fill="#374151" transform="rotate(-90 53 359)">Gerçek Sınıf</text>
  <rect x="68" y="258" width="86" height="26" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="111" y="276" font-size="14" font-weight="600" text-anchor="middle" fill="#374151">Pozitif</text>
  <rect x="68" y="434" width="86" height="26" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="111" y="452" font-size="14" font-weight="600" text-anchor="middle" fill="#374151">Negatif</text>

  <!-- Hücreler -->
  <!-- DP / TP -->
  <rect x="160" y="186" width="210" height="170" rx="10" fill="url(#greenCell)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="265" y="246" font-size="30" font-weight="bold" text-anchor="middle" fill="#065f46">DP</text>
  <text x="265" y="276" font-size="16" font-weight="600" text-anchor="middle" fill="#065f46">Doğru Pozitif</text>
  <text x="265" y="298" font-size="15" text-anchor="middle" fill="#047857">(TP)</text>

  <!-- YN / FN -->
  <rect x="376" y="186" width="210" height="170" rx="10" fill="url(#redCell)" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="481" y="236" font-size="30" font-weight="bold" text-anchor="middle" fill="#991b1b">YN</text>
  <text x="481" y="266" font-size="16" font-weight="600" text-anchor="middle" fill="#991b1b">Yanlış Negatif</text>
  <text x="481" y="288" font-size="15" text-anchor="middle" fill="#b91c1c">(FN)</text>
  <rect x="431" y="302" width="100" height="26" rx="13" fill="#ef4444"/>
  <text x="481" y="320" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Tip II hata</text>

  <!-- YP / FP -->
  <rect x="160" y="362" width="210" height="170" rx="10" fill="url(#amberCell)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="265" y="412" font-size="30" font-weight="bold" text-anchor="middle" fill="#92400e">YP</text>
  <text x="265" y="442" font-size="16" font-weight="600" text-anchor="middle" fill="#92400e">Yanlış Pozitif</text>
  <text x="265" y="464" font-size="15" text-anchor="middle" fill="#b45309">(FP)</text>
  <rect x="220" y="478" width="90" height="26" rx="13" fill="#f59e0b"/>
  <text x="265" y="496" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Tip I hata</text>

  <!-- DN / TN -->
  <rect x="376" y="362" width="210" height="170" rx="10" fill="url(#greenCell)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="481" y="422" font-size="30" font-weight="bold" text-anchor="middle" fill="#065f46">DN</text>
  <text x="481" y="452" font-size="16" font-weight="600" text-anchor="middle" fill="#065f46">Doğru Negatif</text>
  <text x="481" y="474" font-size="15" text-anchor="middle" fill="#047857">(TN)</text>

  <!-- Matris notu -->
  <text x="373" y="566" font-size="14" text-anchor="middle" fill="#4b5563"><tspan font-weight="bold" fill="#059669">Köşegen (yeşil):</tspan> doğru tahminler</text>
  <text x="373" y="588" font-size="14" text-anchor="middle" fill="#4b5563"><tspan font-weight="bold" fill="#dc2626">Köşegen dışı:</tspan> hatalı tahminler (FP ve FN)</text>

  <!-- ================= SAĞ: METRİK KARTLARI ================= -->
  <text x="880" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">Başarım Ölçütleri</text>

  <!-- Doğruluk -->
  <g transform="translate(640, 122)">
    <rect x="0" y="0" width="480" height="86" rx="10" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="7" height="86" rx="3" fill="#3b82f6"/>
    <text x="22" y="38" font-size="17" font-weight="bold" fill="#1e40af">Doğruluk</text>
    <text x="22" y="60" font-size="13" fill="#4b5563">(Accuracy)</text>
    <text x="196" y="50" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">=</text>
    <text x="340" y="36" font-size="16" font-weight="bold" text-anchor="middle"><tspan fill="#059669">TP</tspan><tspan fill="#1f2937"> + </tspan><tspan fill="#059669">TN</tspan></text>
    <line x1="220" y1="45" x2="460" y2="45" stroke="#1f2937" stroke-width="1.5"/>
    <text x="340" y="66" font-size="16" font-weight="bold" text-anchor="middle"><tspan fill="#059669">TP</tspan><tspan fill="#1f2937"> + </tspan><tspan fill="#059669">TN</tspan><tspan fill="#1f2937"> + </tspan><tspan fill="#d97706">FP</tspan><tspan fill="#1f2937"> + </tspan><tspan fill="#dc2626">FN</tspan></text>
  </g>

  <!-- Kesinlik -->
  <g transform="translate(640, 218)">
    <rect x="0" y="0" width="480" height="86" rx="10" fill="#ffffff" stroke="#ede9fe" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="7" height="86" rx="3" fill="#8b5cf6"/>
    <text x="22" y="38" font-size="17" font-weight="bold" fill="#5b21b6">Kesinlik</text>
    <text x="22" y="60" font-size="13" fill="#4b5563">(Precision)</text>
    <text x="196" y="50" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">=</text>
    <text x="340" y="36" font-size="16" font-weight="bold" text-anchor="middle" fill="#059669">TP</text>
    <line x1="260" y1="45" x2="420" y2="45" stroke="#1f2937" stroke-width="1.5"/>
    <text x="340" y="66" font-size="16" font-weight="bold" text-anchor="middle"><tspan fill="#059669">TP</tspan><tspan fill="#1f2937"> + </tspan><tspan fill="#d97706">FP</tspan></text>
  </g>

  <!-- Duyarlılık -->
  <g transform="translate(640, 314)">
    <rect x="0" y="0" width="480" height="86" rx="10" fill="#ffffff" stroke="#cffafe" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="7" height="86" rx="3" fill="#06b6d4"/>
    <text x="22" y="38" font-size="17" font-weight="bold" fill="#0e7490">Duyarlılık</text>
    <text x="22" y="60" font-size="13" fill="#4b5563">(Recall, TPR)</text>
    <text x="196" y="50" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">=</text>
    <text x="340" y="36" font-size="16" font-weight="bold" text-anchor="middle" fill="#059669">TP</text>
    <line x1="260" y1="45" x2="420" y2="45" stroke="#1f2937" stroke-width="1.5"/>
    <text x="340" y="66" font-size="16" font-weight="bold" text-anchor="middle"><tspan fill="#059669">TP</tspan><tspan fill="#1f2937"> + </tspan><tspan fill="#dc2626">FN</tspan></text>
  </g>

  <!-- Özgüllük -->
  <g transform="translate(640, 410)">
    <rect x="0" y="0" width="480" height="86" rx="10" fill="#ffffff" stroke="#d1fae5" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="7" height="86" rx="3" fill="#10b981"/>
    <text x="22" y="38" font-size="17" font-weight="bold" fill="#047857">Özgüllük</text>
    <text x="22" y="60" font-size="13" fill="#4b5563">(Specificity)</text>
    <text x="196" y="50" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">=</text>
    <text x="340" y="36" font-size="16" font-weight="bold" text-anchor="middle" fill="#059669">TN</text>
    <line x1="260" y1="45" x2="420" y2="45" stroke="#1f2937" stroke-width="1.5"/>
    <text x="340" y="66" font-size="16" font-weight="bold" text-anchor="middle"><tspan fill="#059669">TN</tspan><tspan fill="#1f2937"> + </tspan><tspan fill="#d97706">FP</tspan></text>
  </g>

  <!-- F1 -->
  <g transform="translate(640, 506)">
    <rect x="0" y="0" width="480" height="86" rx="10" fill="#ffffff" stroke="#fef3c7" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="7" height="86" rx="3" fill="#f59e0b"/>
    <text x="22" y="38" font-size="17" font-weight="bold" fill="#b45309">F1 Skoru</text>
    <text x="22" y="60" font-size="13" fill="#4b5563">(F1 Score)</text>
    <text x="196" y="50" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">=</text>
    <text x="340" y="36" font-size="15" font-weight="bold" text-anchor="middle"><tspan fill="#1f2937">2 · </tspan><tspan fill="#5b21b6">Kesinlik</tspan><tspan fill="#1f2937"> · </tspan><tspan fill="#0e7490">Duyarlılık</tspan></text>
    <line x1="220" y1="45" x2="460" y2="45" stroke="#1f2937" stroke-width="1.5"/>
    <text x="340" y="66" font-size="15" font-weight="bold" text-anchor="middle"><tspan fill="#5b21b6">Kesinlik</tspan><tspan fill="#1f2937"> + </tspan><tspan fill="#0e7490">Duyarlılık</tspan></text>
  </g>
</svg>
