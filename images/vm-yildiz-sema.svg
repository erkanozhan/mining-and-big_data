<!-- Şekil: Yıldız şeması (star schema) | Ders notu: Veri Madenciliği ve Büyük Veri -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gradFact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gradDim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.15"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font-size: 24px; font-weight: bold; fill: #111827; }
      .subtitle { font-size: 14px; fill: #4b5563; }
      .tName { font-size: 17px; font-weight: bold; fill: #ffffff; }
      .tTag { font-size: 13px; fill: #ffffff; text-anchor: end; opacity: 0.9; }
      .col { font-size: 14px; fill: #1f2937; font-family: Consolas, 'Courier New', monospace; }
      .colM { font-size: 14px; fill: #047857; font-weight: bold; font-family: Consolas, 'Courier New', monospace; }
      .type { font-size: 13px; fill: #6b7280; text-anchor: end; }
      .badge { font-size: 13px; font-weight: bold; text-anchor: middle; }
      .rel { stroke: #6b7280; stroke-width: 2; fill: none; }
      .card { fill: #ffffff; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="550" y="44" text-anchor="middle" class="title">Yıldız Şeması (Star Schema)</text>
  <text x="550" y="70" text-anchor="middle" class="subtitle">Merkezde olgu (fact) tablosu, çevresinde boyut (dimension) tabloları</text>

